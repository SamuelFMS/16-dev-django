{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <title>{% block title %}Titre par défaut{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'polls/style.css' %}">
    {% block css %}{% endblock %}
</head>
<body>
<header>
    {% block header %}
    <h1>Mon site de sondages</h1>
    {% if user.is_authenticated %}
    <div class="flex">
        <p>{{ user.username }}</p>
        <form action="{% url 'polls:logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Se déconnecter</button>
        </form>
    </div>
    {% else %}
    <a href="{% url 'polls:login' %}">Se connecter</a>
    {% endif %}
    {% endblock %}
</header>

<main>
    {% block main %}
    {% endblock %}
</main>
</body>
</html>
