{% if latest_question_list %}
    <ul>
    {% for question in latest_question_list %}
        <!-- A éviter
        <li><a href="/polls/{{ question.id }}/">{{ question.question_text }}</a></li>
        -->
        <!-- Plutot passer par la route -->
        <li><a href="{% url 'polls:detail' question.id %}">{{question.id}} - {{ question.question_text }} ({{ question.pub_date }})</a></li>
    {% endfor %}
    </ul>
{% else %}
    <p>No polls are available.</p>
{% endif %}
<a href="{% url 'polls:create' %}">Créer un sondage</a>
